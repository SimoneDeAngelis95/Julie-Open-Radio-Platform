# Optional overlay, selected by ./julie when JULIE_PROXY_ENABLED=1.
# Requires Docker Compose 2.24.4+ for !override.
# Combine compose.yaml, compose.dashboard.yaml and this file with the same project.
services:
  dashboard:
    ports: !override
      - "127.0.0.1:8010:8000"
  icecast:
    ports: !override
      - "127.0.0.1:8000:8000"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dashboard/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - julie_proxy_data:/data
      - julie_proxy_config:/config
volumes:
  julie_proxy_data:
  julie_proxy_config:
